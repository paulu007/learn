name: Build

# E release pipeline (spec §65–§69).
#
#   Pull request -> format check + analyze + unit/widget tests.
#                   Builds run too (artifacts only, never released).
#   Tag v* (v1.0.0) -> everything above, then release builds whose
#                   artifacts are published to the GitHub Release:
#                     E-<version>-android.apk
#                     E-<version>-windows.zip
#                     E-<version>-linux.deb
#                     E-<version>-linux.rpm
#   workflow_dispatch -> manual run from the Actions tab.
#
# Quality gates (spec §67): the release job only runs when format,
# analyze, tests, AND all platform builds succeed, and it verifies
# every artifact exists before publishing. A broken build can never
# become a Release.
#
# Versioning (spec §69): the single source of truth is APP_VERSION
# below, kept in sync with AppInfo.version in
# lib/core/constants/app_info.dart and pubspec.yaml.

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.3"
  APP_VERSION: "1.0.0"

jobs:
  # ------------------------------------------------------------------
  # PR gate: format + analyze + tests (spec §66, §67).
  check:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # ------------------------------------------------------------------
  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cache Gradle dependencies between runs.
      - uses: gradle/actions/setup-gradle@v4

      - run: flutter pub get
      # minSdk 26 (Android 8.0+) is set in android/app/build.gradle.kts.
      # Release is signed with debug keys (see build.gradle.kts) so it
      # installs for testing; add real signing before Play Store upload.
      - run: flutter build apk --release

      - name: Rename to spec §68 artifact name
        run: >
          mv build/app/outputs/flutter-apk/app-release.apk
          E-${{ env.APP_VERSION }}-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: E-android-apk
          retention-days: 14
          path: E-*-android.apk

  # ------------------------------------------------------------------
  linux:
    name: Linux DEB + RPM
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev dpkg-dev rpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release

      - name: Assemble .deb
        run: |
          VER="${{ env.APP_VERSION }}"
          PKGDIR="pkgdeb/e_${VER}_amd64"
          mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications"
          cp build/linux/x64/release/bundle/e "$PKGDIR/usr/bin/e"
          cp -r build/linux/x64/release/bundle/lib "$PKGDIR/usr/bin/lib"
          cp -r build/linux/x64/release/bundle/data "$PKGDIR/usr/bin/data"
          cp packaging/linux/e.desktop "$PKGDIR/usr/share/applications/e.desktop"
          cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: e
          Version: $VER
          Section: education
          Priority: optional
          Architecture: amd64
          Maintainer: E Contributors
          Depends: libgtk-3-0
          Description: E - offline language learning
           Your language, your lessons, your pace.
          EOF
          dpkg-deb --build "$PKGDIR" "E-${VER}-linux.deb"

      - name: Assemble .rpm
        run: |
          VER="${{ env.APP_VERSION }}"
          STAGE="pkgrpm/stage"
          mkdir -p "$STAGE/bundle"
          cp -r build/linux/x64/release/bundle/* "$STAGE/bundle/"
          cp packaging/linux/e.desktop "$STAGE/e.desktop"
          rpmbuild -bb packaging/linux/rpm/e.spec \
            --define "_version $VER" \
            --define "_build 1" \
            --define "_sourcedir $PWD/$STAGE" \
            --define "_rpmdir $PWD/pkgrpm" \
            --define "_builddir $PWD/pkgrpm/build"
          mv pkgrpm/x86_64/e-*.rpm "E-${VER}-linux.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: E-linux-packages
          retention-days: 14
          path: |
            E-*-linux.deb
            E-*-linux.rpm

  # ------------------------------------------------------------------
  windows:
    name: Windows package
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-windows-desktop

      # The windows/ runner folder is not committed; generate it if missing.
      - name: Ensure Windows platform files exist
        shell: pwsh
        run: |
          if (-Not (Test-Path windows)) { flutter create --platforms=windows . }

      - run: flutter build windows --release

      - name: Build setup.exe with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="${{ env.APP_VERSION }}" packaging\windows\installer.iss

      - name: Zip portable folder + installer
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath E-${{ env.APP_VERSION }}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: E-windows-package
          retention-days: 14
          path: |
            E-*-windows.zip
            installer-output/e-windows-setup.exe

  # ------------------------------------------------------------------
  # macOS is parked (spec §64–§65 list it as a goal): it needs a
  # macos/ runner folder (`flutter create --platforms=macos` on a Mac)
  # and Apple signing for distribution. Uncomment when ready:
  #
  # macos:
  #   name: macOS package
  #   needs: check
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: ${{ env.FLUTTER_VERSION }}
  #         channel: stable
  #         cache: true
  #     - run: flutter pub get
  #     - run: flutter config --enable-macos-desktop
  #     - run: flutter build macos --release
  #     - run: |
  #         ditto -c -k --sequesterRsrc --keepParent \
  #           build/macos/Build/Products/Release/e.app \
  #           E-${{ env.APP_VERSION }}-macos.zip
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: E-macos-package
  #         retention-days: 14
  #         path: E-*-macos.zip

  # ------------------------------------------------------------------
  # Tag-only release (spec §66–§68). Runs only when format, tests,
  # and ALL platform builds passed; fails loudly if any artifact
  # is missing (spec §67) instead of publishing a partial Release.
  release:
    name: GitHub Release
    needs: [check, android, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify all required artifacts exist
        run: |
          ls -la
          test -f E-${{ env.APP_VERSION }}-android.apk || \
            (echo "::error::missing Android APK" && exit 1)
          test -f E-${{ env.APP_VERSION }}-windows.zip || \
            (echo "::error::missing Windows zip" && exit 1)
          test -f E-${{ env.APP_VERSION }}-linux.deb || \
            (echo "::error::missing Linux .deb" && exit 1)
          test -f E-${{ env.APP_VERSION }}-linux.rpm || \
            (echo "::error::missing Linux .rpm" && exit 1)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            E-${{ env.APP_VERSION }}-android.apk
            E-${{ env.APP_VERSION }}-windows.zip
            E-${{ env.APP_VERSION }}-linux.deb
            E-${{ env.APP_VERSION }}-linux.rpm
            installer-output/e-windows-setup.exe
          generate_release_notes: true
