name: Build

# Builds the E app and attaches one installable file per OS to every
# successful run on main/master (continuous Release):
#
#   Android -> e-android-v<run>.apk   (universal release APK, Android 8.0+)
#   Linux   -> e-linux-v<run>.deb     (Debian package: /usr/bin/e)
#   Windows -> e-windows-setup-v<run>.exe (Inno Setup installer)
#
# Triggers:
#   - push to main/master  -> analyze + builds + continuous Release
#   - pull_request          -> analyze + builds (binaries as artifacts only,
#                             NOT attached to the Release)
#   - tag v* (e.g. v1.0.0)  -> analyze + builds + a versioned GitHub Release
#                             with the same three files
#   - workflow_dispatch     -> manual run from the Actions tab

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.3"
  APP_VERSION: "1.0.0"

jobs:
  # ------------------------------------------------------------------
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ------------------------------------------------------------------
  android:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cache Gradle dependencies between runs.
      - uses: gradle/actions/setup-gradle@v4

      - run: flutter pub get
      # minSdk 26 (Android 8.0+) is set in android/app/build.gradle.kts.
      # Release is signed with debug keys (see build.gradle.kts) so it
      # installs for testing; add real signing before Play Store upload.
      # --split-per-abi keeps each APK small; the Release takes the arm64
      # build, which covers the vast majority of devices.
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --debug

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             e-android-v${{ github.run_number }}.apk
          mv build/app/outputs/flutter-apk/app-debug.apk \
             e-android-debug-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: e-android
          retention-days: 14
          path: |
            e-android-v*.apk

  # ------------------------------------------------------------------
  linux:
    name: Linux .deb
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release

      - name: Assemble .deb
        run: |
          VER="${{ env.APP_VERSION }}+${{ github.run_number }}"
          PKGDIR="pkgdeb/e_${VER}_amd64"
          mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications"
          cp build/linux/x64/release/bundle/e "$PKGDIR/usr/bin/e"
          cp -r build/linux/x64/release/bundle/lib "$PKGDIR/usr/bin/lib"
          cp -r build/linux/x64/release/bundle/data "$PKGDIR/usr/bin/data"
          cp packaging/linux/e.desktop "$PKGDIR/usr/share/applications/e.desktop"
          cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: e
          Version: $VER
          Section: education
          Priority: optional
          Architecture: amd64
          Maintainer: E Contributors
          Depends: libgtk-3-0
          Description: E - offline language learning
           Your language, your lessons, your pace.
          EOF
          dpkg-deb --build "$PKGDIR"
          mv "pkgdeb/e_${VER}_amd64.deb" "e-linux-v${{ github.run_number }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: e-linux
          retention-days: 14
          path: e-linux-v*.deb

  # ------------------------------------------------------------------
  windows:
    name: Windows setup.exe
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-windows-desktop

      # The windows/ runner folder is not committed; generate it if missing.
      - name: Ensure Windows platform files exist
        shell: pwsh
        run: |
          if (-Not (Test-Path windows)) { flutter create --platforms=windows . }

      - run: flutter build windows --release

      - name: Build setup.exe with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="${{ env.APP_VERSION }}+${{ github.run_number }}" packaging\windows\installer.iss
          Move-Item installer-output\e-windows-setup.exe e-windows-setup-v${{ github.run_number }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: e-windows
          retention-days: 14
          path: e-windows-setup-v*.exe

  # ------------------------------------------------------------------
  release:
    name: Attach binaries to Release
    needs: [analyze, android, linux, windows]
    # Pushes to main/master update the rolling "continuous" Release.
    # Tags (v*) create a versioned Release instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Versioned tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/e-android/*.apk
            dist/e-linux/*.deb
            dist/e-windows/*.exe
          generate_release_notes: true

      - name: Continuous main-branch release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "Continuous build (main)"
          prerelease: true
          files: |
            dist/e-android/*.apk
            dist/e-linux/*.deb
            dist/e-windows/*.exe
          body: |
            Latest successful build of the default branch.
            Commit: ${{ github.sha }}
